# Veda2 stage 1, run (1): the question that is still unanswered.
#
# Three attempts failed for reasons that had nothing to do with whether
# training helps: forward KL flattened, a warm start from Veda1 began 12
# points behind, and reverse KL ran the logits away. This isolates the
# question by removing every degree of freedom that caused those.
#
# The second-cumulant head is held at its warm start. Its contribution is
# quadratic in so_q and so_k, so a step size tuned for the base
# projections runs it away: measured, the logit spread grew 6x in 48
# updates. Frozen, the only thing training can move is the base
# projections -- exactly the parameterisation Veda1 is known to train.
#
# The objective is the oracle top-k BCE alone. It states what the kernel
# reads, and it is usable now that it centres each row: the second-order
# term is a sum of non-negative products, i.e. a large positive offset,
# and before centring that offset *was* the loss (537, grad_norm 7522
# against a clip of 1.0).
run_name: stage1_veda2_frozen_t37
checkpoint_root: weights/MiniMax-H3
sample_cache: artifacts/samples/moviegen_video_bench
geometries: ['1:1@37', '4:3@37', '16:9@37', '9:16@37']
geometry_sampling: cycle
variant: FL2VA
tasks: [t2va]
plan_dir: plans/released
schedule: turbo
num_steps: 8
teacher_adapter: weights/turbo_lora/minimax_h3_turbo_v4_step600_ema.safetensors
keep_ratio: 0.1
teacher_q_tiles: 1.0
second_order_rank: 128
count_term: true
freeze_second_order: true
heat_reduce: sum
kl_weight: 0.0
topk_weight: 1.0
# Patience off, max_drop on. 'No improvement' cut a previous run at 50
# updates when it was merely flat: at these learning rates the base
# projections need hundreds of updates to reach a useful scale, so a
# plateau early on is the journey, not the verdict. Divergence is the
# failure that actually happened, twice, and it does not care how old the
# run is. 0.12 is double the deepest legitimate dip measured here
# (0.061 by update 11 at this lr), so only a runaway trips it.
abort_window: 8
abort_patience: 0
abort_max_drop: 0.12
accum: 4
steps: 400
# Back to Veda1's own learning rate, and for its reason: that recipe is
# known to converge, over 600 updates. 1e-4 was tried first on the theory
# that it would refine the closed-form initialisation rather than
# overwrite it, and over 50 updates it moved nothing at all -- every
# geometry flat to within 0.01 of where it started. So the choice is not
# between refining and overwriting, it is between learning a projection
# and keeping the closed form, and only the full journey answers that.
# The early dip (0.061 of kept_over_ceiling by update 11) is part of it.
lr: 1.0e-3
warmup: 20
save_every: 25
keep_optimizer: 1
out_dir: runs
offload_blocks: 30
prefetch: 1
mlp_chunk_rows: 8192
