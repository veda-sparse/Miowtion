# Smoke test of mixed-geometry stage 1 on 2x RTX 4090, not a training recipe:
# every geometry of the multi-geometry search (9:16 mirrored from 16:9) once,
# one denoising step each, warm-started from a single-geometry predictor.
# Checks plan selection, sample selection by latent_t, memory at 103k tokens,
# warm start and checkpointing.
run_name: stage1_turbo8_multigeo_smoke_4090
checkpoint_root: weights/MiniMax-H3
sample_cache: artifacts/samples/moviegen_multigeo_train
geometries: ['1:1@37', '4:3@37', '16:9@37', '9:16@37', '1:1@72', '4:3@72',
             '16:9@72', '9:16@72', '1:1@102', '4:3@102', '16:9@102',
             '9:16@102']
geometry_sampling: cycle
trajectory_steps: 1
variant: FL2VA
tasks: [t2va]
plan_dir: runs/search_turbo8_multigeo_4090/plans
schedule: turbo
num_steps: 8
teacher_adapter: weights/turbo_lora/minimax_h3_turbo_v4_step600_ema.safetensors
init_from: runs/stage1_turbo8_4090/ckpt/step_0000050
keep_ratio: 0.1
teacher_q_tiles: 1.0
accum: 2
steps: 6
warmup: 1
lr: 1.0e-3
save_every: 6
out_dir: runs
offload_blocks: 44
prefetch: 1
mlp_chunk_rows: 8192
offload_optimizer: true
