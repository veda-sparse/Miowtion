# Four-way comparison on the 12 demo captions, 95% sparsity target, 5 s.
# The prompts are the prompt-expansion output taken verbatim from the
# preview site; the source clips were 10-15 s but every arm renders
# latent_t 37, which is what makes the sparsity target hard.
#
# Nothing differs between the arms except the router: same sample cache,
# same seed, same geometry, same turbo schedule and steps, same few-step
# LoRA, same bf16 decode, and no dense_steps anywhere (no arm gets a
# dense first step).
root: weights/MiniMax-H3
variant: FL2VA
schedule: turbo
num_steps: 8
adapter: weights/turbo_lora/minimax_h3_turbo_v4_step600_ema.safetensors
sample_cache: artifacts/samples/demo12
seed: 0
keep_ratio: 0.05
offload_blocks: 30
prefetch: 1
mlp_chunk_rows: 8192
decode_dtype: bf16
sample_id: [
  demo01_01M4G4ZS]
geometry: ['9:16@37']
attention: [veda]
predictor: weights/veda/veda2_r16.safetensors
out_dir: artifacts/demo12_compare/veda2_9x16
