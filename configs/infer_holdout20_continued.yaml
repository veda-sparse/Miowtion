# The Veda arm of a fixed holdout with a
# predictor continued from the released step-600 bundle, on ONE RTX PRO 6000
# Blackwell.
#
# Keep the sample ids, geometries and seed fixed when comparing predictors.
# Only `attention`, `predictor` and `out_dir`
# differ, plus the memory settings a 96 GB card allows.
root: weights/MiniMax-H3
variant: FL2VA
schedule: turbo
num_steps: 8
adapter: weights/turbo_lora/minimax_h3_turbo_v4_step600_ema.safetensors
sample_cache: artifacts/samples/moviegen_holdout20
sample_id: [holdout5s_0000, holdout5s_0001, holdout5s_0002, holdout5s_0003,
            holdout5s_0004, holdout10s_0000, holdout10s_0001, holdout10s_0002,
            holdout10s_0003, holdout10s_0004, holdout10s_0005,
            holdout10s_0006, holdout10s_0007, holdout14s_0000,
            holdout14s_0001, holdout14s_0002, holdout14s_0003,
            holdout14s_0004, holdout14s_0005, holdout14s_0006]
geometry: ['4:3@37', '1:1@37', '4:3@37', '1:1@37', '9:16@37',
           '9:16@72', '16:9@72', '16:9@72', '4:3@72', '4:3@72', '1:1@72',
           '16:9@72', '1:1@72', '16:9@102', '4:3@102', '4:3@102',
           '16:9@102', '9:16@102', '4:3@102', '4:3@102']
seed: 0
attention: [veda]
predictor: artifacts/init/continued_step15_bf16.safetensors
keep_ratio: 0.1
offload_blocks: 0
prefetch: 1
mlp_chunk_rows: 8192
veda_collect_mib: 2048
decode_dtype: bf16
out_dir: artifacts/generate/holdout20_continued_step15
