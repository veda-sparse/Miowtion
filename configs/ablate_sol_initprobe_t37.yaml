# Predictor initialization probe: does a Veda2-initialized predictor start
# better than today's, in the metrics stage-1 training already watches?
# densities[0] is the keep ratio the oracle masks use; steps are the four
# the ablation used, so the two runs are comparable.
run_name: sol_initprobe_t37
checkpoint_root: weights/MiniMax-H3
sample_cache: artifacts/samples/moviegen_holdout20
geometries: ['16:9@37']
variant: FL2VA
tasks: [t2va]
steps: [0, 2, 5, 7]
schedule: turbo
num_steps: 8
teacher_adapter: weights/turbo_lora/minimax_h3_turbo_v4_step600_ema.safetensors
tile_shape: 4x4x8
densities: [0.1]
query_tiles: 16
out_dir: runs
offload_blocks: 30
prefetch: 1
mlp_chunk_rows: 8192
