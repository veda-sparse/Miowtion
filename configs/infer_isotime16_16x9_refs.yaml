# Equal-time comparison: Sol against Veda1 / Veda2, each with and
# without Sol's zero-order compensation, all at the SAME attention
# seconds rather than the same density.  A user picks a runtime, not a
# sparsity, and the arms do not cost the same per unit density, so the
# densities differ and that spread is the result.
#
# Time budget: Sol's own 11.89 s at this geometry, measured clean on an
# idle card (no density probe inside the timed region).
#
# Densities come from each arm's measured cost curve
# (scripts/iso_time_budget.py): veda is 6.08 s + 34.53 s * d, so 11.89 s
# buys 16.8%.  The unfused compensation arm is not here at all: its
# fixed cost alone is 25.62 s, which is 2.2x the entire budget, so no
# density fits it -- the +Sol arms have to be the fused kernel.
#
# 16 single-shot MovieGen bench captions.  Multi-shot prompts drift to a
# different cut at low budget and that swamps every temporal
# measurement, which is why the flash was invisible on the demo set
# (docs/features/veda2.md 2.28).
root: weights/MiniMax-H3
variant: FL2VA
schedule: turbo
num_steps: 8
adapter: weights/turbo_lora/minimax_h3_turbo_v4_step600_ema.safetensors
sample_cache: artifacts/samples/moviegen_video_bench
seed: 0
offload_blocks: 30
prefetch: 1
mlp_chunk_rows: 8192
decode_dtype: bf16
geometry: ['16:9@37']
sample_id: [
  moviegen_0000, moviegen_0002, moviegen_0004, moviegen_0006,
  moviegen_0008, moviegen_0010, moviegen_0012, moviegen_0014,
  moviegen_0016, moviegen_0018, moviegen_0020, moviegen_0022,
  moviegen_0024, moviegen_0026, moviegen_0028, moviegen_0030]
attention: [dense, sol]
sol_tau: 0.7
keep_ratio: 0.168
out_dir: artifacts/isotime16/refs
