# E4: does the compensation survive end to end? The one comparison where
# NOTHING but the compensation differs -- same 128-token 3D tiles, same
# trained predictor, same budget, same FA4 kernel, same seed and prompt.
# Every published comparison of Sol against Veda, theirs and ours, also
# changes the block geometry and the budget type, so none of them can
# attribute a difference to the compensation itself.
#
# attention: [veda, veda_comp] runs both arms in one process, so they
# also share the adapter merge and the AdaLN tables, and the attention
# seconds are directly comparable: veda_comp's extra cost is exactly the
# [rows, n_tiles] centroid term.
schedule: turbo
num_steps: 8
adapter: weights/turbo_lora/minimax_h3_turbo_v4_step600_ema.safetensors
sample_cache: artifacts/samples/demo12
seed: 0
keep_ratio: 0.05
offload_blocks: 30
prefetch: 1
mlp_chunk_rows: 8192
decode_dtype: bf16
sample_id: [
  demo00_01M4GA5P, demo02_01M4G57X, demo03_01M4G3N3, demo04_01M4G1FK,
  demo05_01M4G148, demo06_01M4G02G, demo07_01M4FWTA, demo08_01M4FVNY,
  demo09_01M4FJEZ, demo10_01M4FDY7, demo11_01M4FAD6]
geometry: ['16:9@37']
attention: [veda, veda_comp]
predictor: weights/veda/veda2_r16.safetensors
out_dir: artifacts/demo12_compare/e4_16x9
