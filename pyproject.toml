[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miowtion"
version = "0.1.0"
description = "MiniMax-H3 training framework with Veda block-sparse attention."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "torch>=2.8",
  "numpy>=1.24",
  "safetensors>=0.4.3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# GPU training / search machines. Git dependencies are pinned to the SHAs in
# docs/dependencies.md; bump them only in a dedicated commit.
gpu = [
  "triton>=3.3",
  "flash-attn-4 @ git+https://github.com/Dao-AILab/flash-attention@d15f1531a460ba456f41b01a774f33ab2db8febf#subdirectory=flash_attn/cute",
]
# Offline prompt encoding (Qwen3-VL text tower, the release's VAEs).
encode = ["transformers>=4.57", "accelerate", "torchvision", "pillow",
          "diffusers==0.32.2"]

[tool.setuptools.packages.find]
include = ["miowtion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: requires a CUDA GPU (auto-skipped otherwise)",
  "slow: long-running test",
]
